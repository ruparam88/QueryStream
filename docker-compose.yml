services:
  # ---------------------------------------------------------------------------
  # 1. Redis Cache Service
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: querystream-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - querystream-net

  # ---------------------------------------------------------------------------
  # 2. FastAPI Backend
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: querystream-backend
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=gemini-2.5-flash
      - GEMINI_EMBED_MODEL=gemini-embedding-2
      - REDIS_URL=redis://redis:6379
      - SESSION_TTL_SECONDS=3600
      - SEM_CACHE_THRESHOLD=0.95
      - CACHE_TTL_SECONDS=86400
    depends_on:
      - redis
    restart: unless-stopped
    networks:
      - querystream-net

  # ---------------------------------------------------------------------------
  # 3. React Frontend
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: querystream-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - querystream-net

volumes:
  redis_data:

networks:
  querystream-net:
    driver: bridge
